<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/><stop offset=".55" stop-color="#0b2a17"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="t" x1="0" x2="1">
      <stop offset="0" stop-color="#2ECC71"/><stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2ECC71" stop-opacity=".45"/><stop offset="1" stop-color="#2ECC71" stop-opacity="0"/>
    </radialGradient>
    <g id="leaf"><path d="M0 0C-14-10-16-26 0-20C16-26 14-10 0 0Z"/></g>
    <g id="clover">
      <use href="#leaf"/><use href="#leaf" transform="rotate(90)"/>
      <use href="#leaf" transform="rotate(180)"/><use href="#leaf" transform="rotate(270)"/>
    </g>
  </defs>

  <rect width="1000" height="280" rx="16" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="999" height="279" rx="16" fill="none" stroke="#2ECC71" stroke-opacity=".35"/>

  <!-- floating clovers -->
  <g fill="#2ECC71">
    <g transform="translate(90,300)"><g><animateMotion path="M0 0 L25 -340" dur="9s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.55;0" dur="9s" begin="-1s" repeatCount="indefinite"/><use href="#clover" transform="scale(.5)"/></g></g>
    <g transform="translate(240,300)"><g><animateMotion path="M0 0 L-20 -340" dur="12s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.45;0" dur="12s" begin="-6s" repeatCount="indefinite"/><use href="#clover" transform="scale(.35)"/></g></g>
    <g transform="translate(410,300)"><g><animateMotion path="M0 0 L30 -340" dur="10s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="10s" begin="-3s" repeatCount="indefinite"/><use href="#clover" transform="scale(.6)"/></g></g>
    <g transform="translate(560,300)"><g><animateMotion path="M0 0 L-35 -340" dur="13s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.4;0" dur="13s" begin="-8s" repeatCount="indefinite"/><use href="#clover" transform="scale(.4)"/></g></g>
    <g transform="translate(680,300)"><g><animateMotion path="M0 0 L20 -340" dur="11s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="11s" begin="-2s" repeatCount="indefinite"/><use href="#clover" transform="scale(.3)"/></g></g>
  </g>
  <g fill="#D4AF37">
    <g transform="translate(160,300)"><g><animateMotion path="M0 0 L-15 -340" dur="14s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="14s" begin="-9s" repeatCount="indefinite"/><circle r="2"/></g></g>
    <g transform="translate(330,300)"><g><animateMotion path="M0 0 L25 -340" dur="8s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="8s" begin="-4s" repeatCount="indefinite"/><circle r="1.8"/></g></g>
    <g transform="translate(500,300)"><g><animateMotion path="M0 0 L-25 -340" dur="10s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="10s" begin="-7s" repeatCount="indefinite"/><circle r="2.2"/></g></g>
  </g>

  <!-- magic circle -->
  <g transform="translate(830,140)">
    <circle r="200" fill="url(#glow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <circle r="105" fill="none" stroke="#2ECC71" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle r="92" fill="none" stroke="#D4AF37" stroke-opacity=".75" stroke-width="2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#2ECC71" stroke-opacity=".8" stroke-width="1.5"/>
      <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#2ECC71" stroke-opacity=".8" stroke-width="1.5" transform="rotate(45)"/>
    </g>
    <g fill="#2ECC71">
      <animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/>
      <use href="#clover" transform="scale(1.6)"/>
    </g>
  </g>

  <!-- text -->
  <text x="60" y="88" font-family="'Courier New',monospace" font-size="13" letter-spacing="4" fill="#2ECC71">BLACK BULLS // BACKEND MAGE</text>
  <text x="58" y="138" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="3" fill="url(#t)">SHREYAS PRAJAPATI</text>
  <rect x="60" y="154" height="3" rx="1.5" fill="#D4AF37">
    <animate attributeName="width" values="0;340;340" keyTimes="0;.4;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="190" font-family="'Courier New',monospace" font-size="15" letter-spacing="3" fill="#D4AF37">GO · DISTRIBUTED SYSTEMS · CLOUD</text>
  <text x="60" y="222" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#8b949e">My magic is never giving up.</text>
</svg>
