<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="g"><stop offset="0" stop-color="#2ECC71" stop-opacity=".4"/><stop offset="1" stop-color="#2ECC71" stop-opacity="0"/></radialGradient>
    <g id="leaf"><path d="M0 0C-14-10-16-26 0-20C16-26 14-10 0 0Z"/></g>
    <g id="clover"><use href="#leaf"/><use href="#leaf" transform="rotate(90)"/><use href="#leaf" transform="rotate(180)"/><use href="#leaf" transform="rotate(270)"/></g>
  </defs>
  <g transform="translate(100,100)">
    <circle r="98" fill="url(#g)"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <circle r="90" fill="none" stroke="#2ECC71" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle r="78" fill="none" stroke="#D4AF37" stroke-opacity=".8" stroke-width="2"/>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
      <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#2ECC71" stroke-opacity=".8" stroke-width="1.5"/>
      <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#2ECC71" stroke-opacity=".8" stroke-width="1.5" transform="rotate(45)"/>
    </g>
    <g fill="#2ECC71"><animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/><use href="#clover" transform="scale(1.4)"/></g>
  </g>
</svg>
